
[project]
name = "nf-mle-deployment-project"
version = "0.1.0"
description = "Predict NYC yellow taxi trip duration with a RandomForest, tracked in MLflow and served with FastAPI."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "mlflow==3.16.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "jupyter>=1.0", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_duration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
